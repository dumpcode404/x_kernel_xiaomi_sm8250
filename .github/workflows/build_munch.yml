name: Kernel Build (Munch)

on:
  workflow_dispatch:
    inputs:
      KERNEL_TREE:
        description: "Kernel Tree"
        default: "https://github.com/dumpcode404/x_kernel_xiaomi_sm8250"
        required: true
      KERNEL_TREE_BRANCH:
        description: "Kernel Tree Branch"
        required: true
        default: "X-kernel"

      KERNELSU_SETUP_URL:
        description: "KernelSU setup.sh URL (empty it to disable)"
        required: false
        default: "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh"
      KERNELSU_SETUP_BRANCH:
        description: "KernelSU Branch"
        required: false
        default: "master"
      KERNELSU_PATCHES:
        description: "Patches for KernelSU. Urls leading to .patch file which are split by comma"
        required: false
        default: ""

      ANYKERNEL_URL:
        description: "AnyKernel URL (empty it to disable)"
        default: "https://github.com/dumpcode404/AKmunch"
        required: false
      ANYKERNEL_BRANCH:
        description: "AnyKernel Branch"
        default: "main"
        required: false
      ANYKERNEL_ZIP_NAME:
        description: "File name (without .zip extension)"
        default: "X-munch"
        required: false

      CLANG_DOWNLOAD_URL:
        description: "Clang download url"
        default: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst"
        required: true

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KERNEL_TREE: ${{ github.event.inputs.KERNEL_TREE }}
      KERNEL_TREE_BRANCH: ${{ github.event.inputs.KERNEL_TREE_BRANCH }}
      KERNELSU_SETUP_URL: ${{ github.event.inputs.KERNELSU_SETUP_URL }}
      KERNELSU_SETUP_BRANCH: ${{ github.event.inputs.KERNELSU_SETUP_BRANCH }}
      KERNELSU_PATCHES: ${{ github.event.inputs.KERNELSU_PATCHES }}
      ANYKERNEL_URL: ${{ github.event.inputs.ANYKERNEL_URL }}
      ANYKERNEL_BRANCH: ${{ github.event.inputs.ANYKERNEL_BRANCH }}
      ANYKERNEL_ZIP_NAME: ${{ github.event.inputs.ANYKERNEL_ZIP_NAME }}
      CLANG_DOWNLOAD_URL: ${{ github.event.inputs.CLANG_DOWNLOAD_URL }}
    steps:
      - name: Display Inputs
        run: |
          echo "::group::Inputs"
          echo "Kernel Tree: $KERNEL_TREE/tree/$KERNEL_TREE_BRANCH"
          echo "KernelSU Setup URL: $KERNELSU_SETUP_URL"
          echo "KernelSU Branch: $KERNELSU_SETUP_BRANCH"
          echo "AnyKernel URL: $ANYKERNEL_URL/tree/$ANYKERNEL_BRANCH"
          echo "::endgroup::"

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-ci-v2
          restore-keys: |
            clang-

      - name: Download and Extract Clang (if not cached)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -e
          wget -q "$CLANG_DOWNLOAD_URL" -O clang.tar.zst
          mkdir -p clang
          tar --zstd -xf clang.tar.zst -C clang
          rm clang.tar.zst

      - name: Initialize workspace
        id: workspace
        run: |
          set -e
          git clone --depth=1 "$KERNEL_TREE" -b "$KERNEL_TREE_BRANCH" kernel_tree
          echo "kernel_folder=$(pwd)/kernel_tree" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libssl-dev \
            lld \
            python3 \
            zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Setup Toolchain
        run: |
          set -e
          CLANG_DIR=$(find "$GITHUB_WORKSPACE/clang" -type d -name bin | head -1)
          echo "CLANG_DIR=$CLANG_DIR"
          echo "$CLANG_DIR" >> "$GITHUB_PATH"
          "$CLANG_DIR/clang" --version

      - name: Building kernel
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}
        run: |
          set -eo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host 4.19.404R"

          if [[ -n "$KERNELSU_SETUP_URL" && -n "$KERNELSU_SETUP_BRANCH" ]]; then
            curl -LSs "$KERNELSU_SETUP_URL" | bash -s "$KERNELSU_SETUP_BRANCH"
            if [ -n "$KERNELSU_PATCHES" ]; then
              cd Kernel*
              echo "$KERNELSU_PATCHES" | tr ',' '\n' | while read -r PATCH; do
                TRIMMED=$(echo "$PATCH" | xargs)
                [ -z "$TRIMMED" ] && continue
                TEMP_PATCH_FILE="/tmp/downloaded_patch_$(date +%s%N).patch"
                curl -fsSL "$TRIMMED" -o "$TEMP_PATCH_FILE"
                patch -p1 < "$TEMP_PATCH_FILE"
              done
              cd ..
            fi
          fi

          make O=out vendor/munch_defconfig

          make -j"$(nproc)" \
            O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image dtbs

      - name: Build dtb and dtbo.img
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}
        run: |
          set -eo pipefail
          BOOT=out/arch/arm64/boot

          # cari folder dts secara otomatis (vendor/qcom atau qcom)
          FIRST_DTB=$(find "$BOOT/dts" -name '*.dtb' | head -1)
          if [ -z "$FIRST_DTB" ]; then
            echo "::error::Tidak ada file .dtb. Cek hasil build dtbs."
            exit 1
          fi
          DTS=$(dirname "$FIRST_DTB")
          echo "DTS dir: $DTS"
          ls "$DTS" | head -50

          # dtb = gabungan 3 base dtb kona (sesuai Makefile dts)
          for f in kona.dtb kona-v2.dtb kona-v2.1.dtb; do
            if [ ! -f "$DTS/$f" ]; then
              echo "::error::$f tidak ditemukan di $DTS"
              exit 1
            fi
          done
          cat "$DTS/kona.dtb" "$DTS/kona-v2.dtb" "$DTS/kona-v2.1.dtb" > "$BOOT/dtb.img"

          # dtbo.img dari overlay
          if ! ls "$DTS"/*.dtbo >/dev/null 2>&1; then
            echo "::error::Tidak ada file .dtbo. Pastikan CONFIG_BUILD_ARM64_DT_OVERLAY=y di defconfig."
            exit 1
          fi

          echo "::group::Semua overlay (.dtbo)"
          ls -l "$DTS"/*.dtbo
          echo "::endgroup::"

          # hanya overlay munch (sesuai Makefile dts: munch-sm8250-overlay.dtbo)
          DTBO_FILES="$DTS/munch-sm8250-overlay.dtbo"
          if [ ! -f "$DTBO_FILES" ]; then
            echo "::error::munch-sm8250-overlay.dtbo tidak ditemukan. Cek CONFIG_MACH_XIAOMI dan CONFIG_MACH_XIAOMI_SM8250 di defconfig."
            exit 1
          fi
          echo "Pakai overlay: $DTBO_FILES"

          # pakai mkdtboimg milik kernel kalau ada, kalau tidak download dari AOSP
          MKDTBO=$(find . -name mkdtboimg.py | head -1)
          if [ -z "$MKDTBO" ]; then
            curl -fsSL "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" | base64 -d > /tmp/mkdtboimg.py
            MKDTBO=/tmp/mkdtboimg.py
          fi

          # shellcheck disable=SC2086
          python3 "$MKDTBO" create "$BOOT/dtbo.img" --page_size=4096 $DTBO_FILES
          ls -lh "$BOOT/dtb.img" "$BOOT/dtbo.img"

      - name: Debug boot files
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}
        run: |
          find out/arch/arm64/boot -maxdepth 1 -type f | grep -E "Image|dtb|dtbo" || true

      - name: "Upload Image"
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: ${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/Image

      - name: "Upload dtb"
        uses: actions/upload-artifact@v4
        with:
          name: dtb
          path: ${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtb.img

      - name: "Upload dtbo.img (AOSP)"
        uses: actions/upload-artifact@v4
        with:
          name: dtbo.img
          path: ${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtbo.img

      - name: AnyKernel3
        if: ${{ success() && github.event.inputs.ANYKERNEL_URL != '' && github.event.inputs.ANYKERNEL_BRANCH != '' && github.event.inputs.ANYKERNEL_ZIP_NAME != '' }}
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/
        run: |
          set -e
          git clone --recursive --depth=1 "$ANYKERNEL_URL" -b "$ANYKERNEL_BRANCH" AnyKernel3
          cp -f Image AnyKernel3/
          cp -f dtb.img AnyKernel3/dtb
          cp -f dtbo.img AnyKernel3/
          cd AnyKernel3
          zip -q -r "$ANYKERNEL_ZIP_NAME.zip" * -x ".git*"
          mv "$ANYKERNEL_ZIP_NAME.zip" ../

      - name: "Upload AnyKernel"
        if: ${{ success() && github.event.inputs.ANYKERNEL_URL != '' && github.event.inputs.ANYKERNEL_BRANCH != '' && github.event.inputs.ANYKERNEL_ZIP_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.ANYKERNEL_ZIP_NAME }}
          path: |
            ${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/AnyKernel3/
            !${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/AnyKernel3/.git
            !${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/AnyKernel3/.github
